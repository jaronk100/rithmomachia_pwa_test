<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa065"/>
      <stop offset="48%" stop-color="#b07e42"/>
      <stop offset="100%" stop-color="#8f6230"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6231"/>
      <stop offset="100%" stop-color="#5c3a17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cd82"/>
      <stop offset="100%" stop-color="#c8974a"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.012" numOctaves="4" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- backdrop; content stays inside the safe circle for maskable icons -->
  <rect width="512" height="512" fill="#14100c"/>
  <rect x="56" y="56" width="400" height="400" rx="52" fill="url(#frame)"/>
  <rect x="86" y="86" width="340" height="340" rx="30" fill="url(#wood)"/>
  <rect x="86" y="86" width="340" height="340" rx="30" fill="#fff"
        filter="url(#grain)" opacity="0.16" style="mix-blend-mode:multiply"/>

  <!-- board lines -->
  <g stroke="rgba(48,25,4,0.45)" stroke-width="3">
    <path d="M171 86v340M256 86v340M341 86v340"/>
    <path d="M86 171h340M86 256h340M86 341h340"/>
  </g>

  <!-- dark army: a square and a triangle -->
  <rect x="108" y="108" width="54" height="54" rx="7" fill="#231708" stroke="#0c0703" stroke-width="4"/>
  <path d="M213.5 110 L246 160 L181 160 Z" fill="#231708" stroke="#0c0703" stroke-width="4"/>

  <!-- light army: a circle -->
  <circle cx="299" cy="365" r="28" fill="#efdcaf" stroke="#a6813c" stroke-width="4"/>

  <!-- the pyramid, centred: a gold ziggurat -->
  <g fill="url(#gold)" stroke="#7a5418" stroke-width="3" stroke-linejoin="round">
    <rect x="236" y="206" width="40" height="16" rx="4"/>
    <rect x="223" y="226" width="66" height="16" rx="4"/>
    <rect x="210" y="246" width="92" height="16" rx="4"/>
    <rect x="197" y="266" width="118" height="16" rx="4"/>
  </g>
</svg>
